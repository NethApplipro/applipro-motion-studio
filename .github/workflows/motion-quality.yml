name: Qualité motion
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [9x16, 1x1, 16x9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run check
      - run: npm run render -- PremierJour ${{ matrix.format }}
      - run: npm run qa -- PremierJour ${{ matrix.format }}
      - run: npm run determinism -- PremierJour-${{ matrix.format }}
      # Verdict calculé : QA finale de ce format + critique committée (review.json) selon la cible du film.
      - run: npm run verdict -- PremierJour ${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PremierJour-${{ matrix.format }}
          path: |
            out/PremierJour-${{ matrix.format }}.mp4
            reviews/PremierJour-${{ matrix.format }}/qa.*
            reviews/PremierJour-${{ matrix.format }}/review.md
          retention-days: 7
